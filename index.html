<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">

        <link rel="icon" type="image/png" sizes="192x192" href="img/favicon/android-chrome-192x192.png">

                </div>
                <p data-i18n="about" class="aboutMe"></p>

        </div>

        <script src="js/languages.js?v0.5"></script>
